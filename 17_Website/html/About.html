<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uber Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>



<!-- Hero Section -->
<section class="hero">
  <div class="hero-content">
    <h1>Go anywhere with Uber</h1>

    <div class="ride-box">
      <input type="text" placeholder="Enter pickup location">
      <input type="text" placeholder="Enter destination">
      <button>See prices</button>
    </div>
  </div>
</section>

<!-- Services -->
<section class="services">
  <h2>Suggestions</h2>
  <div class="cards">
    <div class="card">
      <h3>Ride</h3>
      <p>Go anywhere with Uber.</p>
    </div>
    <div class="card">
      <h3>Drive</h3>
      <p>Earn money on your schedule.</p>
    </div>
    <div class="card">
      <h3>Eat</h3>
      <p>Order food from restaurants.</p>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="footer">
  <p>© 2026 Uber Clone. All rights reserved.</p>
</footer>

</body>
</html>
